version: '3.8'

services:
  notifier:
    build:
      context: .
      dockerfile: Dockerfile
    image: 2b-notifier:latest   # nombre fijo: deploy/autodeploy.sh corre los tests en esta imagen
    container_name: 2b-notifier
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Fallbacks si no están en .env
      - CHECK_INTERVAL_SECONDS=${CHECK_INTERVAL_SECONDS:-90}
      - MAX_MSRP_PRICE_MXN=${MAX_MSRP_PRICE_MXN:-1600.0}
      - STATE_FILE=/app/state/state.json
    volumes:
      # Persistencia del perfil, notas, caché de noticias y contador diario de Gemini
      - notifier_state:/app/state
    mem_limit: 400m

volumes:
  notifier_state:
